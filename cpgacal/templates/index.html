<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CGPA Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>CGPA Calculator</h1>
        <form method="POST">
            <div id="subject-list">
                <div class="subject-row">
                    <input type="number" step="0.01" name="grade" placeholder="Grade (e.g. 9.0)" required>
                    <input type="number" step="1" name="credit" placeholder="Credits (e.g. 4)" required>
                </div>
            </div>
            <button type="button" onclick="addSubject()">+ Add Subject</button>
            <hr>
            <button type="submit" class="calc-btn">Calculate CGPA</button>
        </form>

        {% if cgpa is not none %}
        <div class="result">
            <h2>Your CGPA: {{ cgpa }}</h2>
        </div>
        {% endif %}
    </div>

    <script>
        function addSubject() {
            const div = document.createElement('div');
            div.className = 'subject-row';
            div.innerHTML = `
                <input type="number" step="0.01" name="grade" placeholder="Grade" required>
                <input type="number" step="1" name="credit" placeholder="Credits" required>
            `;
            document.getElementById('subject-list').appendChild(div);
        }
    </script>
</body>

</html>
